name: ya

on:
  workflow_dispatch:
  schedule:
    # 07:00 no horário de Brasília (UTC-3)
    - cron: '0 10 * * 1'
jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run OpenCode
        run: |
          opencode run "corrija o blank.yml para que funcione perfeitamente"
          opencode run "atualize os dados da tabela que está no meu computador sem criar outro arquivo, quero os dados de hoje."

      - name: Commit INVEST.txt
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add INVEST.txt
          git commit -m "Atualiza resumo de investimentos" || echo "Nada para commit"
          git push
