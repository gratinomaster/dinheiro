name: ya

on:
  workflow_dispatch:
  schedule:
    # 07:00 no horário de Brasília (UTC-3)
    - cron: '0 10 * * 1'
jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run OpenCode
        run: |
          opencode run "atualize os dados da planilha existente b3_completo_fundamentos.xlsx no repositório com os dados de hoje, sem criar outro arquivo e sem apagar abas, fórmulas ou dados históricos; salve a atualização no próprio arquivo"

      - name: Commit planilha
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add b3_completo_fundamentos.xlsx
          git commit -m "Atualiza planilha de investimentos" || echo "Nada para commit"
          git push
