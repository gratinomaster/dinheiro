name: besst

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run OpenCode
        run: |
          opencode run "Localize e carregue os arquivos INVEST.txt e o arquivo .xlsx no diretório de trabalho. Processe os dados fundamentalistas para classificar as ações por setor. Para cada categoria (Bancos, Energia, Saneamento, Seguros e Telecomunicações), determine o melhor ativo com base nas métricas presentes nos arquivos (ex: P/L, ROE, Dividend Yield e Margens). Gere um relatório comparativo resumido e salve o resultado no arquivo BEST.txt."

      - name: Commit arquivos
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add INVEST.txt hoje.txt BESST.txt
          git commit -m "Atualiza resumo e recomendação semanal" || echo "Nada para commit"
          git push
