name: besst

on:
  workflow_dispatch:

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run OpenCode
        run: |
          opencode run "LEIA INVEST.txt e a planilha do excel que está no meu pc e diga a melhor de cada uma hoje Melhor empresa do tipo banco, energia, saneamento, seguros e telecomunicações, salve em BESST.txt"

      - name: Commit INVEST.txt
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add INVEST.txt hoje.txt
          git commit -m "Atualiza resumo e recomendação diária" || echo "Nada para commit"
          git push
          
          
          
