
name: Executar OpenCode - Gerar e Salvar Arquivos

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Digite o que deseja que o OpenCode faça"
        required: true
        type: string

permissions:
  contents: write

jobs:
  executar-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # =====================================
      # 1. Preparar ambiente
      # =====================================
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================
      # 2. Instalar dependências
      # =====================================
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ffmpeg \
            python3 \
            python3-pip \
            zip \
            unzip \
            git

      # =====================================
      # 3. Instalar OpenCode
      # =====================================
      - name: Instalar OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # =====================================
      # 4. Verificar instalação
      # =====================================
      - name: Verificar OpenCode
        run: |
          opencode --version

      # =====================================
      # 5. Preparar diretório de resultados
      # =====================================
      - name: Preparar diretório
        run: |
          mkdir -p resultados

      # =====================================
      # 6. Executar solicitação
      # =====================================
      - name: Executar solicitação no OpenCode
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail

          echo "Executando solicitação..."

          opencode run --dir "$GITHUB_WORKSPACE" \
            "SOLICITAÇÃO DO USUÁRIO:

          $PROMPT

          INSTRUÇÕES:
          - Execute a tarefa solicitada integralmente.
          - Utilize as ferramentas disponíveis no ambiente.
          - Crie os arquivos necessários.
          - Escolha os nomes e formatos adequados ao pedido.
          - Salve os arquivos finais dentro da pasta resultados/.
          - Não se limite a explicar como fazer: execute o trabalho.
          - Verifique se os arquivos foram realmente gerados."

      # =====================================
      # 7. Verificar arquivos gerados
      # =====================================
      - name: Verificar resultados
        run: |
          echo "Arquivos encontrados:"

          find resultados -type f -print

          if [ -z "$(find resultados -type f -print -quit)" ]; then
            echo "ERRO: Nenhum arquivo foi gerado."
            exit 1
          fi

      # =====================================
      # 8. Fazer commit e push
      # =====================================
      - name: Commit e push para o GitHub
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A resultados/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
          else
            git commit -m "Arquivos gerados automaticamente pelo OpenCode"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # =====================================
      # 9. Disponibilizar arquivos para download
      # =====================================
      - name: Publicar arquivos gerados
        uses: actions/upload-artifact@v5
        with:
          name: resultados-opencode
          path: resultados/
          if-no-files-found: error
          retention-days: 7

      # =====================================
      # 10. Resumo
      # =====================================
      - name: Resumo da execução
        if: success()
        run: |
          echo "===================================="
          echo "EXECUÇÃO CONCLUÍDA"
          echo "===================================="
          echo "Arquivos salvos em resultados/"
          echo "Commit enviado para: ${GITHUB_REF_NAME}"
          echo "===================================="
