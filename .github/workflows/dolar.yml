
name: Executar OpenCode - Gerar e Salvar Arquivos

on:
  # Executar automaticamente a cada hora
  schedule:
    - cron: '0 * * * *'

  # Permitir execução manual
  workflow_dispatch:
    inputs:
      prompt:
        description: "Digite o que deseja que o OpenCode faça"
        required: false
        type: string
        default: "oi, tudo bem?"

permissions:
  contents: write

concurrency:
  group: executar-opencode
  cancel-in-progress: false

jobs:
  executar-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # =====================================
      # 1. Baixar repositório
      # =====================================
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================
      # 2. Instalar dependências
      # =====================================
      - name: Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ffmpeg \
            python3 \
            python3-pip \
            zip \
            unzip \
            git

      # =====================================
      # 3. Instalar OpenCode
      # =====================================
      - name: Instalar OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # =====================================
      # 4. Verificar instalação
      # =====================================
      - name: Verificar OpenCode
        run: |
          opencode --version

      # =====================================
      # 5. Definir solicitação automática
      # =====================================
      - name: Definir prompt
        env:
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          if [ -n "$INPUT_PROMPT" ]; then
            echo "PROMPT=$INPUT_PROMPT" >> "$GITHUB_ENV"
          else
            echo "PROMPT=oi, tudo bem?" >> "$GITHUB_ENV"
          fi

      # =====================================
      # 6. Executar OpenCode
      # =====================================
      - name: Executar solicitação no OpenCode
        run: |
          set -euo pipefail

          echo "===================================="
          echo "EXECUTANDO OPENCODE"
          echo "===================================="

          echo "Solicitação: $PROMPT"

          opencode run --dir "$GITHUB_WORKSPACE" \
            "SOLICITAÇÃO:

          $PROMPT

          INSTRUÇÕES:

          - Execute a solicitação diretamente.
          - Não espere novas instruções do usuário.
          - Utilize as ferramentas disponíveis.
          - Analise o repositório e seu conteúdo.
          - Crie ou modifique os arquivos necessários.
          - Salve os arquivos diretamente na raiz do repositório.
          - Não crie a pasta resultados.
          - Não coloque os arquivos finais em subpastas desnecessárias.
          - Não se limite a explicar como fazer.
          - Execute efetivamente o trabalho.
          - Verifique os arquivos criados e modificados.
          - Preserve os arquivos existentes que não precisam ser alterados."

      # =====================================
      # 7. Verificar alterações
      # =====================================
      - name: Verificar arquivos modificados
        run: |
          echo "===================================="
          echo "ARQUIVOS MODIFICADOS"
          echo "===================================="

          git status --short

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nenhuma alteração detectada."
            exit 0
          fi

      # =====================================
      # 8. Commit e push
      # =====================================
      - name: Commit e push para o GitHub
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Adicionar arquivos modificados e novos
          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
          else

            git commit -m "Arquivos gerados automaticamente pelo OpenCode"

            git push origin "HEAD:${GITHUB_REF_NAME}"

            echo "===================================="
            echo "COMMIT E PUSH CONCLUÍDOS"
            echo "===================================="

          fi

      # =====================================
      # 9. Resumo
      # =====================================
      - name: Resumo da execução
        if: success()
        run: |
          echo "===================================="
          echo "EXECUÇÃO CONCLUÍDA"
          echo "===================================="

          echo "Solicitação: $PROMPT"
          echo "Frequência: A cada 1 hora"
          echo "Destino: Raiz do repositório"
          echo "Commit: Automático"
          echo "Push: Automático"

          echo "===================================="
