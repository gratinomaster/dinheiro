
name: Executar OpenCode - Gravar Lives

on:
  workflow_dispatch:

jobs:
  executar-opencode:
    runs-on: ubuntu-latest

    steps:
      # ================================
      # 1. Preparar ambiente
      # ================================
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ffmpeg python3 python3-pip

      # ================================
      # 2. Instalar OpenCode
      # ================================
      - name: Instalar OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

      # ================================
      # 3. Ajustar PATH
      # ================================
      - name: Configurar PATH
        run: |
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      # ================================
      # 4. Verificar instalação
      # ================================
      - name: Verificar OpenCode
        run: |
          opencode --version

      # ================================
      # 5. Executar tarefa
      # ================================
      - name: Gravar lives
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          pergunta=$(cat <<'PROMPT'
          me diga quanto está o dolar hoje
          PROMPT
          )

          opencode run "$pergunta"
