
name: Executar OpenCode - Tarefas Automáticas

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Descreva o que deseja que o OpenCode faça"
        required: true
        type: string

permissions:
  contents: read

jobs:
  executar-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. Preparar ambiente
      # ==========================================
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ffmpeg \
            python3 \
            python3-pip \
            zip \
            unzip \
            git

      # ==========================================
      # 2. Instalar OpenCode
      # ==========================================
      - name: Instalar OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

      # ==========================================
      # 3. Configurar PATH
      # ==========================================
      - name: Configurar PATH
        run: |
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 4. Verificar instalação
      # ==========================================
      - name: Verificar OpenCode
        run: |
          opencode --version

      # ==========================================
      # 5. Preparar diretórios
      # ==========================================
      - name: Preparar ambiente de trabalho
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resultados"

          echo "Diretório de trabalho:"
          pwd

      # ==========================================
      # 6. Executar solicitação do usuário
      # ==========================================
      - name: Executar solicitação
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "=========================================="
          echo "SOLICITAÇÃO RECEBIDA"
          echo "=========================================="

          printf '%s\n' "$PROMPT"

          echo "=========================================="
          echo "INICIANDO OPENCODE"
          echo "=========================================="

          opencode run --dir "$GITHUB_WORKSPACE" \
            "SOLICITAÇÃO DO USUÁRIO:

          $PROMPT

          INSTRUÇÕES OBRIGATÓRIAS:

          1. Execute integralmente a solicitação recebida.
          2. Não substitua a execução por explicações ou instruções.
          3. Produza os resultados reais solicitados.
          4. Salve todos os arquivos produzidos dentro da pasta resultados.
          5. Escolha livremente os nomes, formatos e extensões necessários.
          6. Utilize as ferramentas, programas e dependências disponíveis.
          7. Se precisar criar scripts auxiliares, execute-os para produzir o resultado final.
          8. Não considere um código ou uma descrição como resultado final quando o usuário solicitar um arquivo pronto.
          9. Verifique se os arquivos foram realmente criados.
          10. Informe quais arquivos foram produzidos e onde estão salvos.
          salve o que encontrou em DOLAR.txt

          IMPORTANTE:
          A pasta de destino de todos os resultados é:
          $GITHUB_WORKSPACE/resultados"

      # ==========================================
      # 7. Verificar resultados
      # ==========================================
      - name: Verificar arquivos produzidos
        run: |
          echo "=========================================="
          echo "ARQUIVOS PRODUZIDOS"
          echo "=========================================="

          find resultados -type f -printf '%p (%s bytes)\n'

          if [ -z "$(find resultados -type f -print -quit)" ]; then
            echo "ERRO: Nenhum arquivo foi produzido!"
            exit 1
          fi

          echo "=========================================="
          echo "TOTAL DE ARQUIVOS:"
          find resultados -type f | wc -l

          echo "TAMANHO TOTAL:"
          du -sh resultados

      # ==========================================
      # 8. Disponibilizar arquivos para download
      # ==========================================
      - name: Salvar resultados
        uses: actions/upload-artifact@v5
        with:
          name: resultados-opencode
          path: resultados/
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # 9. Finalização
      # ==========================================
      - name: Resumo da execução
        if: success()
        run: |
          echo "=========================================="
          echo "EXECUÇÃO CONCLUÍDA"
          echo "=========================================="
          echo "Os arquivos estão disponíveis em Artifacts."
          echo "Nome: resultados-opencode"
          echo "=========================================="
