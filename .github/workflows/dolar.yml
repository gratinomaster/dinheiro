
name: Executar OpenCode - Gravar Lives

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executar-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ================================
      # 1. Preparar ambiente
      # ================================
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ffmpeg python3 python3-pip

      # ================================
      # 2. Instalar OpenCode
      # ================================
      - name: Instalar OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

      # ================================
      # 3. Configurar PATH
      # ================================
      - name: Configurar PATH
        run: |
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ================================
      # 4. Verificar instalação
      # ================================
      - name: Verificar OpenCode
        run: |
          opencode --version

      # ================================
      # 5. Executar tarefa
      # ================================
      - name: Gravar lives
        run: |
          opencode run "Me diga quanto está o dólar hoje, incluindo cotação comercial, compra, venda, variação e fonte da informação, salve em DOLAR.txt"
