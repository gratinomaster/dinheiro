
name: Executar OpenCode - Tarefas Automáticas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executar-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ================================
      # 1. Preparar ambiente
      # ================================
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ffmpeg python3 python3-pip zip unzip

      # ================================
      # 2. Instalar OpenCode
      # ================================
      - name: Instalar OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

      # ================================
      # 3. Configurar PATH
      # ================================
      - name: Configurar PATH
        run: |
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ================================
      # 4. Verificar instalação
      # ================================
      - name: Verificar OpenCode
        run: |
          opencode --version

      # ================================
      # 5. Preparar diretório
      # ================================
      - name: Preparar ambiente de trabalho
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resultados"

      # ================================
      # 6. Executar solicitação
      # ================================
      - name: Executar solicitação
        run: |
          cd "$GITHUB_WORKSPACE"

          opencode run --dir "$GITHUB_WORKSPACE" \
          "Pesquise quanto está o dólar hoje, incluindo cotação comercial, compra, venda, variação e fonte da informação.

          Execute integralmente a solicitação.

          Salve todos os arquivos necessários dentro da pasta resultados.

          Escolha livremente os formatos, nomes e extensões de acordo com a natureza da solicitação.

          Não limite a criação de arquivos a nenhum formato específico.

          Utilize as ferramentas e dependências disponíveis para produzir os resultados reais solicitados.

          Ao terminar, verifique se os arquivos foram efetivamente criados e salvos na pasta resultados.
          salve o que encontrou em DOLAR.txt"

      # ================================
      # 7. Verificar resultados
      # ================================
      - name: Verificar arquivos gerados
        run: |
          echo "Arquivos gerados:"

          find resultados -type f -printf '%p (%s bytes)\n'

          if [ -z "$(find resultados -type f -print -quit)" ]; then
            echo "ERRO: Nenhum arquivo foi criado!"
            exit 1
          fi

      # ================================
      # 8. Disponibilizar resultados
      # ================================
      - name: Salvar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-opencode
          path: resultados/
          if-no-files-found: error
          retention-days: 7
