
name: ya

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 5' # Toda sexta-feira às 06:00, horário de Brasília (UTC-3)

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run OpenCode
        run: |
          opencode run "LEIA https://timesbrasil.com.br/ https://www.cnnbrasil.com.br/money/ https://valor.globo.com/ https://investnews.com.br/ https://www.bloomberglinea.com.br/ e crie um arquivo INVEST.txt com um resumo consolidado das principais notícias de todos os sites."
          opencode run "analise a planilha b3_completo_fundamentos.xlsx disponível no repositório; eu tenho R$ 100,00, diga o que comprar para receber dividendos no mês que vem e indique apenas as melhores opções, sem inventar dados e deixando claro que é uma análise informativa"
          opencode run "salve em hoje.txt uma recomendação objetiva do que comprar, baseada nas notícias coletadas e nos números da planilha b3_completo_fundamentos.xlsx, incluindo justificativa, riscos e a data da análise"

      - name: Commit INVEST.txt
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add INVEST.txt hoje.txt
          git commit -m "Atualiza resumo e recomendação diária" || echo "Nada para commit"
          git push
