
name: Executar OpenCode - Atualizar Arquivos

on:
  # Executar automaticamente a cada hora
  schedule:
    - cron: '0 * * * *'

  # Permitir execução manual
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: executar-opencode
  cancel-in-progress: false

jobs:
  executar-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # =====================================
      # 1. Baixar repositório
      # =====================================
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =====================================
      # 2. Instalar dependências
      # =====================================
      - name: Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ffmpeg \
            python3 \
            python3-pip \
            zip \
            unzip \
            git

      # =====================================
      # 3. Instalar OpenCode
      # =====================================
      - name: Instalar OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # =====================================
      # 4. Verificar instalação
      # =====================================
      - name: Verificar OpenCode
        run: |
          opencode --version

      # =====================================
      # 5. Executar solicitação automática
      # =====================================
      - name: Atualizar arquivos de texto e Excel
        run: |
          set -euo pipefail

          echo "===================================="
          echo "INICIANDO ATUALIZAÇÃO"
          echo "===================================="

          opencode run --dir "$GITHUB_WORKSPACE" \
            "Atualize os 2 arquivos de textos que estão no meu computador e a planilha do excel com informações de hoje."

      # =====================================
      # 6. Verificar arquivos
      # =====================================
      - name: Verificar arquivos atualizados
        run: |
          set -euo pipefail

          echo "===================================="
          echo "ARQUIVOS DO REPOSITÓRIO"
          echo "===================================="

          git status --short

          echo "===================================="
          echo "ARQUIVOS DE TEXTO"
          echo "===================================="

          find . -type f \
            \( -iname "*.txt" -o -iname "*.md" \) \
            -not -path "./.git/*" \
            -print

          echo "===================================="
          echo "PLANILHAS EXCEL"
          echo "===================================="

          find . -type f \
            -iname "*.xlsx" \
            -not -path "./.git/*" \
            -print

      # =====================================
      # 7. Commit e push
      # =====================================
      - name: Commit e push para o GitHub
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "Nenhuma alteração para commit."

          else

            git commit -m \
              "Atualização automática dos arquivos de texto e Excel"

            git push origin "HEAD:${GITHUB_REF_NAME}"

            echo "===================================="
            echo "COMMIT E PUSH CONCLUÍDOS"
            echo "===================================="

          fi

      # =====================================
      # 8. Resumo
      # =====================================
      - name: Resumo da execução
        if: success()
        run: |
          echo "===================================="
          echo "EXECUÇÃO CONCLUÍDA"
          echo "===================================="

          echo "Solicitação:"
          echo "Atualizar os 2 arquivos de textos e a planilha Excel."

          echo "Frequência: A cada 1 hora"
          echo "Destino: Raiz do repositório"
          echo "Commit: Automático"
          echo "Push: Automático"

          echo "===================================="
