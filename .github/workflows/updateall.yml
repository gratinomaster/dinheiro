name: uptodate

on:
  schedule:
    - cron: '0 9 * * *' # Todos os dias às 6h de Brasília (UTC-3)
  workflow_dispatch:

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run OpenCode
        run: |
          opencode run "atualize os 2 arquivos de textos que estão no meu computador e a planilha do excel com informações de hoje"

      - name: Commit arquivos atualizados
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add INVEST.txt hoje.txt
          git commit -m "Atualiza resumo e recomendação diária" || echo "Nada para commit"
          git push
