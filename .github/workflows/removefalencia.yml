
name: removefalencia

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: write

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Aguardar 1 minuto
        run: sleep 60

      - name: Instalar OpenCode
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Configurar pesquisa automática
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "ERRO: Configure TAVILY_API_KEY nos Secrets."
            exit 1
          fi

          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "websearch": {
              "provider": "tavily"
            },
            "permissions": [
              {
                "action": "websearch",
                "resource": "*",
                "effect": "allow"
              },
              {
                "action": "webfetch",
                "resource": "*",
                "effect": "allow"
              }
            ]
          }
          EOF

          echo "Pesquisa automática configurada."

      - name: Verificar planilha Excel
        run: |
          mapfile -d '' XLSX_FILES < <(
            find . -type f -iname "*.xlsx" \
              -not -path "./.git/*" -print0
          )

          if [ "${#XLSX_FILES[@]}" -ne 1 ]; then
            echo "ERRO: Esperada exatamente uma planilha XLSX."
            echo "Encontradas: ${#XLSX_FILES[@]}"
            exit 1
          fi

          echo "Planilha localizada: ${XLSX_FILES[0]}"

      - name: Filtrar empresas da planilha
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          opencode run "
          Localize o arquivo Excel (.xlsx) no diretório de trabalho.

          Analise todas as empresas e identifique exclusivamente aquelas
          que estejam em alguma das seguintes situações:

          1. OPA (Oferta Pública de Aquisição) em andamento ou vigente.
          2. Recuperação judicial em andamento.
          3. Recuperação extrajudicial em andamento.
          4. Falência decretada.

          FONTES DE CONSULTA:

          Consulte fontes oficiais e atualizadas, principalmente:

          - CVM.
          - Sistema SRE da CVM.
          - B3.
          - Documentos oficiais das companhias.
          - Diário Oficial.
          - Documentos judiciais oficiais.
          - Decisões judiciais e tribunais competentes.

          PESQUISA NA INTERNET:

          A execução ocorre automaticamente no GitHub Actions.

          - Utilize Web Search com o provedor Tavily configurado.
          - Utilize Web Fetch para consultar documentos e páginas.
          - Não solicite autorização ou confirmação humana.
          - Não interrompa a execução para solicitar escolha de provedor.
          - Não utilize ferramentas que dependam de aprovação manual.
          - Pesquise individualmente cada empresa.
          - Faça pesquisas paralelas quando possível.
          - Consulte os documentos originais das fontes oficiais.
          - Não considere resultados genéricos como confirmação.
          - Se uma fonte estiver indisponível, tente outra fonte oficial.
          - Não invente informações.
          - Se não conseguir confirmar uma situação, mantenha o ativo.

          EXCLUSÕES:

          EXCLUA da planilha Excel todas as linhas referentes às empresas
          que se enquadrem em pelo menos uma das quatro situações.

          REGRAS IMPORTANTES:

          - Não exclua empresas apenas por rumores ou notícias sem confirmação.
          - Não exclua OPAs encerradas, canceladas ou indeferidas.
          - Não exclua empresas que já encerraram sua recuperação judicial,
            salvo se houver falência decretada.
          - Não exclua empresas que já encerraram sua recuperação extrajudicial.
          - Não altere os demais ativos.
          - Preserve fórmulas, formatação, abas e estrutura da planilha.
          - Preserve estilos, larguras, alturas, filtros e freeze panes.
          - Não altere as abas B3_Ticker_Produtos e Resumo se não houver
            necessidade de exclusão nessas abas.
          - Se houver dúvida, mantenha o ativo.

          VERIFICAÇÃO:

          Antes de excluir cada empresa:

          1. Confirme o ticker e o nome empresarial.
          2. Confirme a situação jurídica atual.
          3. Consulte uma fonte oficial.
          4. Verifique se a situação continua vigente.
          5. Registre o endereço da fonte consultada.
          6. Registre a data da confirmação.

          ARQUIVO EXCEL:

          Salve a planilha atualizada substituindo a original.

          Não crie uma planilha simplificada.
          Não remova abas.
          Não recrie a estrutura da planilha.
          Não modifique os ativos que não se enquadram nos critérios.

          RELATÓRIO EXCLUIDOS.txt:

          Gere um arquivo EXCLUIDOS.txt contendo:

          - Ticker.
          - Nome da empresa.
          - Motivo da exclusão.
          - Situação jurídica identificada.
          - Fonte oficial consultada.
          - Link da fonte.
          - Data da confirmação.

          Se nenhuma empresa for excluída, informe isso claramente.

          IMPORTANTE:

          Se não conseguir confirmar oficialmente uma OPA,
          não exclua a empresa por esse motivo.

          Não faça nenhuma análise de indicadores financeiros,
          classificação por setores ou recomendação de investimentos.

          FINALIZAÇÃO:

          Termine todas as pesquisas antes de concluir.
          Não deixe pesquisas pendentes.
          Salve a planilha e o relatório.
          Não solicite confirmação humana.
          "

      - name: Validar arquivos gerados
        run: |
          python3 - <<'PY'
          import glob
          import os
          import zipfile

          arquivos = [
              f for f in glob.glob("**/*.xlsx", recursive=True)
              if ".git/" not in f
          ]

          if len(arquivos) != 1:
              raise SystemExit(
                  f"ERRO: Esperada uma planilha. Encontradas: {len(arquivos)}"
              )

          arquivo = arquivos[0]

          if not zipfile.is_zipfile(arquivo):
              raise SystemExit("ERRO: Arquivo Excel inválido.")

          with zipfile.ZipFile(arquivo) as z:
              erro = z.testzip()
              if erro:
                  raise SystemExit(f"ERRO de integridade: {erro}")

              if "xl/workbook.xml" not in z.namelist():
                  raise SystemExit("ERRO: Estrutura XLSX inválida.")

          print("Planilha Excel validada:", arquivo)

          if not os.path.isfile("EXCLUIDOS.txt"):
              raise SystemExit("ERRO: EXCLUIDOS.txt não foi gerado.")

          if os.path.getsize("EXCLUIDOS.txt") == 0:
              raise SystemExit("ERRO: EXCLUIDOS.txt está vazio.")

          print("Relatório EXCLUIDOS.txt validado.")
          PY

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
          else
            git commit -m "Remove empresas em OPA, recuperação ou falência"
            git push origin HEAD
          fi
